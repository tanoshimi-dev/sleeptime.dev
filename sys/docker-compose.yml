services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - sleeptime-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sleeptime
      - DB_USERNAME=sleeptime
      - DB_PASSWORD=${DB_PASSWORD:-sleeptime_dev_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH0_DOMAIN=${AUTH0_DOMAIN:-dev-ll413keejpz65qwc.us.auth0.com}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-https://api.sleeptime.dev}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sleeptime-net

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sleeptime
      POSTGRES_USER: sleeptime
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sleeptime_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleeptime"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sleeptime-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sleeptime-net

volumes:
  postgres-data:

networks:
  sleeptime-net:
    driver: bridge
