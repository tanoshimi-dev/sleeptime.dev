spring:
  application:
    name: sleeptime-portal

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sleeptime}
    username: ${DB_USERNAME:sleeptime}
    password: ${DB_PASSWORD:sleeptime}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Session (Redis-backed)
  session:
    store-type: redis
    redis:
      namespace: sleeptime:session

  # OAuth2 Resource Server (Auth0 JWT validation)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN:dev-ll413keejpz65qwc.us.auth0.com}/
          audiences: ${AUTH0_AUDIENCE:https://api.sleeptime.dev}

# Auth0 custom config
auth0:
  domain: ${AUTH0_DOMAIN:dev-ll413keejpz65qwc.us.auth0.com}
  audience: ${AUTH0_AUDIENCE:https://api.sleeptime.dev}

# CORS
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}
